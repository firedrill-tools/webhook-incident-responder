[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhook-incident-responder"
version = "0.1.0"
description = "LangGraph and Anthropic event worker with ordered incidents and Slack outbox"
requires-python = ">=3.12"
dependencies = ["langgraph==1.2.15", "langchain-anthropic==1.7.6", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_responder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
