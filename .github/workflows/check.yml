name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra test
      - run: uv run --locked python scripts/build_datasets.py --check
      - run: uv run --locked --extra test pytest -q
      - run: uv build
      - run: uv run --locked python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: webhook-incident-source
          path: dist/
          if-no-files-found: error
