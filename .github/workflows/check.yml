name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra test
      - run: uv run --locked --extra test pytest -q
